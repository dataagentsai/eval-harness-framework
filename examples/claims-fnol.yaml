# What a domain team writes: the preset, its own judge, and its own rules.
# Everything below `evaluators` is FNOL's vocabulary: tool names and limits.
preset: customer-support

judge:                          # for a client: the client's own model endpoint
  model: openai/gpt-oss-120b
  base_url: https://api.groq.com/openai/v1
  api_key_env: GROQ_API_KEY

evaluators:
  pii:
    severity: {DATE_TIME: 0.0}  # dates of an accident are expected in claims

  payout_needs_claim_lookup:    # never pay a claim the agent has not read
    adapter: requires_before
    action: issue_payout
    before: get_claim
    same: [claim_id]

  payout_limit:                 # the agent may pay up to ₹25,000 on its own
    adapter: argument_limit
    tool: issue_payout
    field: amount
    max: 25000

  payout_promise_kept:          # "it's on its way" only after a payout succeeded
    adapter: claim_needs_action
    claims:
      payout_sent: {phrases: ["payout is on its way", "has been paid"], tool: issue_payout}

  escalation:                   # hand to a person exactly when the rules say so
    adapter: decision_vs_should
    decision: escalate
    decision_tool: hand_to_handler
    when:
      - {tool: issue_payout, field: amount, above: 25000}
      - {failed_calls_at_least: 3}
      - {user_says: ["speak to a person", "talk to a human", "complaint"]}

  facts_from_systems:           # claim ids and amounts must come from a tool
    adapter: consistency
    facts:
      claim_id: "CLM-\\d{6}"
      amount: "₹\\s?[\\d,]+"

[project]
name = "evalharness"
version = "0.1.0"
description = "Vendor-neutral checks for AI agents: any provider's evals and guardrails behind one port, one result format."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
# The core needs only YAML. Every provider is an extra, imported only by its
# own adapter module, so choosing a check installs only that check's SDK.
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
judge = ["openai>=1.50"]
azure = ["azure-ai-evaluation==1.18.9"]
deepeval = ["deepeval==4.3.1"]
# 0.4.3 does not import with langchain-community 0.4.2 (FINDINGS.md).
ragas = ["ragas==0.4.3", "langchain-community==0.4.1"]
# spaCy's model is a separate download: en_core_web_sm 3.8.0 (FINDINGS.md).
presidio = ["presidio-analyzer==2.2.364"]

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.6", "types-PyYAML>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalharness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
files = ["src/evalharness"]

[[tool.mypy.overrides]]
# Provider SDKs are untyped or partly typed; their shapes stop at the adapter.
module = ["azure.*", "deepeval.*", "ragas.*", "presidio_analyzer.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]
